<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>em vs rem</title>

<style>
    .parent{
       width: 800px;
       height: 600px;
       background-color: rgb(122, 207, 207);
       border: 2px solid black;
       padding: 25px;
       font-size: 20px ;
    }

    .leftC{
      width: 300px;
      height: 300px;
      background-color: rgb(8, 80, 117);
      display: inline-block;
      border-radius: 5%;
      font-size: 2rem;
    }

    .rightC{
        width: 300px; 
        height: 300px;
        background-color: rgb(8, 80, 117);
        display: inline-block;
        border-radius: 5%;
       font-size: 1em;
    }
</style>

</head>
<body>
    <div class="parent">

        <div class="leftC">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Minus adipisci in repellendus quisquam dolorum accusamus.</p>
        </div>
        <div class="rightC">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Minus adipisci in repellendus quisquam dolorum accusamus .</p>
  
        </div>

    </div>
</body>
</html>
