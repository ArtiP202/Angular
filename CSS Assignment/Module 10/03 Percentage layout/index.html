<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Layout</title>

<style>
    .parent{
       width: 800px;
       height: 100px;
       background-color: rgb(122, 207, 207);
       border: 2px solid black;
       padding: 25px;
      
    }

    .leftC{
      width: 70px;
      height: 70px;
      background-color: rgb(8, 80, 117);
      display: inline-block;
      border: 2px solid black;
    }

    .rightC{
        width: 30px; 
        height: 70px;
        background-color: rgb(8, 80, 117);
        display: inline-block;
        border: 2px solid black;
    }
</style>

</head>
<body>
    <div class="parent">

        <div class="leftC"></div>
        <div class="rightC"></div>

    </div>
</body>
</html>
